<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="farrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53B44A"/>
    </marker>
    <marker id="farrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A90D9"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" letter-spacing="1.5" fill="#8a8f98">ON DISK</text>
  <text x="40" y="58" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">~/.local/share/opencode/</text>

  <!-- ===== memory.db (same height as memories/) ===== -->
  <rect x="40" y="78" width="340" height="534" rx="16" fill="#FCE8EA" stroke="#DD2E44" stroke-width="5"/>
  <text x="210" y="108" text-anchor="middle" font-size="22" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memory.db</text>
  <text x="210" y="130" text-anchor="middle" font-size="13" fill="#6b7280">sibling · never searched</text>

  <!-- usage aligned with memory_summary.md -->
  <rect x="56" y="148" width="308" height="56" rx="10" fill="#ffffff" stroke="#4A90D9" stroke-width="2"/>
  <text x="210" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">usage_count</text>
  <text x="210" y="192" text-anchor="middle" font-size="13" fill="#6b7280">last_usage · ranking input</text>

  <!-- jobs aligned with MEMORY.md / skills/ -->
  <rect x="56" y="212" width="308" height="56" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="210" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">jobs · session_meta</text>
  <text x="210" y="256" text-anchor="middle" font-size="13" fill="#6b7280">lease · enabled / polluted</text>

  <!-- stage1 aligned with rollout_summaries/ -->
  <rect x="56" y="276" width="308" height="56" rx="10" fill="#ffffff" stroke="#53B44A" stroke-width="2"/>
  <text x="210" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">memory_stage1_outputs</text>
  <text x="210" y="320" text-anchor="middle" font-size="13" fill="#6b7280">raw_memory + recap per session</text>

  <rect x="56" y="348" width="308" height="244" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="210" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">candidate pool</text>
  <text x="210" y="432" text-anchor="middle" font-size="13" fill="#8a8f98">not a retrieval index</text>
  <text x="210" y="472" text-anchor="middle" font-size="13" fill="#6b7280">Phase 1 writes rows here.</text>
  <text x="210" y="492" text-anchor="middle" font-size="13" fill="#6b7280">Selected rows become recaps</text>
  <text x="210" y="512" text-anchor="middle" font-size="13" fill="#6b7280">and raw_memories.md.</text>
  <text x="210" y="552" text-anchor="middle" font-size="13" fill="#8a8f98">Read path never queries this</text>
  <text x="210" y="572" text-anchor="middle" font-size="13" fill="#8a8f98">file. Search is markdown only.</text>

  <!-- ===== memories/ ===== -->
  <rect x="500" y="78" width="740" height="534" rx="16" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="524" y="108" font-size="18" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memories/</text>
  <text x="1216" y="108" text-anchor="end" font-size="14" fill="#8a8f98">private git repo</text>

  <text x="524" y="136" font-size="12" letter-spacing="1.2" fill="#8a8f98">ON THE READ PATH</text>

  <rect x="520" y="148" width="700" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="172" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memory_summary.md</text>
  <text x="540" y="192" font-size="13" fill="#6b7280">injected every turn · ~2500 tok cap · first line must be v1</text>

  <rect x="520" y="212" width="342" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="236" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">MEMORY.md</text>
  <text x="540" y="256" font-size="13" fill="#6b7280">handbook · search first</text>

  <rect x="870" y="212" width="350" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="890" y="236" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">skills/</text>
  <text x="890" y="256" font-size="13" fill="#6b7280">reusable procedures</text>

  <rect x="520" y="276" width="700" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="300" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">rollout_summaries/</text>
  <text x="540" y="320" font-size="13" fill="#6b7280">one recap per selected session · published from the db · also searched</text>

  <rect x="520" y="348" width="700" height="44" rx="10" fill="#E8F6E6" stroke="#53B44A" stroke-width="2"/>
  <text x="870" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">2b consolidate  ·  rewrites the files above from the files below</text>

  <text x="524" y="418" font-size="12" letter-spacing="1.2" fill="#8a8f98">PHASE 2 INPUTS · NOT SEARCHED</text>

  <rect x="520" y="428" width="700" height="56" rx="10" fill="#E8F6E6" stroke="#53B44A" stroke-width="2"/>
  <text x="540" y="452" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">raw_memories.md</text>
  <text x="540" y="472" font-size="13" fill="#6b7280">temp merge of selected Phase-1 rows · regenerated each pass</text>

  <rect x="520" y="492" width="700" height="56" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="540" y="516" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">extensions/</text>
  <text x="540" y="536" font-size="13" fill="#6b7280">ad_hoc/notes (never pruned) · optional imports · consolidator promotes into MEMORY.md</text>

  <rect x="520" y="556" width="342" height="40" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="540" y="582" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">phase2_workspace_diff.md</text>

  <rect x="870" y="556" width="350" height="40" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="890" y="582" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">.git/  baseline</text>

  <!-- cite: straight, aligned rows -->
  <line x1="520" y1="176" x2="372" y2="176" stroke="#4A90D9" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#farrow-blue)"/>
  <rect x="414" y="166" width="52" height="20" rx="4" fill="#ffffff"/>
  <text x="440" y="181" text-anchor="middle" font-size="12" fill="#4A90D9">cite</text>

  <!-- publish: straight, aligned rows -->
  <line x1="380" y1="304" x2="512" y2="304" stroke="#53B44A" stroke-width="3" marker-end="url(#farrow-green)"/>
  <rect x="406" y="294" width="68" height="20" rx="4" fill="#ffffff"/>
  <text x="440" y="309" text-anchor="middle" font-size="12" fill="#53B44A">publish</text>

  <!-- ===== bottom flow ===== -->
  <line x1="40" y1="632" x2="1240" y2="632" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="40" y="656" width="200" height="112" rx="12" fill="#FCE8EA" stroke="#DD2E44" stroke-width="4"/>
  <text x="140" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">1  extract</text>
  <text x="140" y="726" text-anchor="middle" font-size="13" fill="#6b7280">transcript → db row</text>
  <line x1="240" y1="712" x2="268" y2="712" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="276" y="656" width="220" height="112" rx="12" fill="#E8F6E6" stroke="#53B44A" stroke-width="4"/>
  <text x="386" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">2a  publish</text>
  <text x="386" y="726" text-anchor="middle" font-size="13" fill="#6b7280">ranked subset → files</text>
  <line x1="496" y1="712" x2="524" y2="712" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="532" y="656" width="250" height="112" rx="12" fill="#E8F6E6" stroke="#53B44A" stroke-width="4"/>
  <text x="657" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">2b  consolidate</text>
  <text x="657" y="726" text-anchor="middle" font-size="13" fill="#6b7280">rewrite handbook + summary</text>
  <line x1="782" y1="712" x2="810" y2="712" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="818" y="656" width="200" height="112" rx="12" fill="#E3F0FA" stroke="#4A90D9" stroke-width="4"/>
  <text x="918" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">3  read</text>
  <text x="918" y="726" text-anchor="middle" font-size="13" fill="#6b7280">inject · search · cite</text>
  <line x1="1018" y1="712" x2="1046" y2="712" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="1054" y="656" width="186" height="112" rx="12" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="1147" y="702" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b7280">next turn</text>
  <text x="1147" y="726" text-anchor="middle" font-size="13" fill="#8a8f98">files, not the db</text>
</svg>
