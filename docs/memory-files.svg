<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1280" height="840" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" letter-spacing="1.5" fill="#8a8f98">ON DISK</text>
  <text x="40" y="58" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">~/.local/share/opencode/</text>

  <!-- ===== memory.db ===== -->
  <rect x="40" y="78" width="340" height="552" rx="16" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="210" y="108" text-anchor="middle" font-size="22" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memory.db</text>
  <text x="210" y="130" text-anchor="middle" font-size="13" fill="#6b7280">sibling · never searched</text>

  <rect x="56" y="148" width="308" height="56" rx="10" fill="#ffffff" stroke="#DD2E44" stroke-width="2"/>
  <text x="210" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">memory_stage1_outputs</text>
  <text x="210" y="192" text-anchor="middle" font-size="13" fill="#6b7280">one row: raw extract + recap</text>

  <rect x="56" y="212" width="308" height="56" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="210" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">jobs · session_meta</text>
  <text x="210" y="256" text-anchor="middle" font-size="13" fill="#6b7280">lease · enabled / polluted</text>

  <text x="210" y="300" text-anchor="middle" font-size="13" fill="#8a8f98">Read path never queries this file.</text>
  <text x="210" y="320" text-anchor="middle" font-size="13" fill="#8a8f98">Search is markdown only.</text>

  <rect x="56" y="344" width="308" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="210" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a3f46">candidate pool</text>
  <text x="210" y="398" text-anchor="middle" font-size="13" fill="#8a8f98">not a retrieval index</text>
  <text x="210" y="418" text-anchor="middle" font-size="13" fill="#6b7280">Phase 1 writes rows here.</text>

  <rect x="56" y="448" width="308" height="56" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="210" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a3f46">usage_count</text>
  <text x="210" y="492" text-anchor="middle" font-size="13" fill="#6b7280">last_usage · ranking input</text>

  <text x="210" y="548" text-anchor="middle" font-size="13" fill="#8a8f98">Publish ranks a subset onto</text>
  <text x="210" y="568" text-anchor="middle" font-size="13" fill="#8a8f98">recaps + raw_memories.md.</text>

  <!-- ===== memories/ ===== -->
  <rect x="500" y="78" width="740" height="552" rx="16" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="524" y="108" font-size="18" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memories/</text>
  <text x="1216" y="108" text-anchor="end" font-size="14" fill="#8a8f98">private git repo</text>

  <text x="524" y="136" font-size="12" letter-spacing="1.2" fill="#8a8f98">PUBLISH WRITES</text>

  <rect x="520" y="148" width="342" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="172" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">rollout_summaries/</text>
  <text x="540" y="192" font-size="13" fill="#6b7280">recaps · one file per session · Phase 2 reads only</text>

  <rect x="870" y="148" width="350" height="56" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="890" y="172" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">raw_memories.md</text>
  <text x="890" y="192" font-size="13" fill="#6b7280">raw extracts · one file · inventory</text>

  <line x1="691" y1="208" x2="691" y2="248" stroke="#6b7280" stroke-width="2.5" marker-end="url(#farrow)"/>
  <line x1="1045" y1="208" x2="1045" y2="248" stroke="#6b7280" stroke-width="2.5" marker-end="url(#farrow)"/>

  <rect x="520" y="252" width="700" height="44" rx="10" fill="#E8F6E6" stroke="#53B44A" stroke-width="2"/>
  <text x="870" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">Phase 2</text>

  <line x1="870" y1="300" x2="870" y2="340" stroke="#6b7280" stroke-width="2.5" marker-end="url(#farrow)"/>

  <rect x="520" y="344" width="342" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="368" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">MEMORY.md</text>
  <text x="540" y="388" font-size="13" fill="#6b7280">handbook · search first</text>

  <rect x="870" y="344" width="350" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="890" y="368" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">skills/</text>
  <text x="890" y="388" font-size="13" fill="#6b7280">if a procedure repeats</text>

  <line x1="691" y1="404" x2="691" y2="444" stroke="#6b7280" stroke-width="2.5" marker-end="url(#farrow)"/>

  <rect x="520" y="448" width="700" height="56" rx="10" fill="#E3F0FA" stroke="#4A90D9" stroke-width="2"/>
  <text x="540" y="472" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">memory_summary.md</text>
  <text x="540" y="492" font-size="13" fill="#6b7280">from MEMORY.md · injected every turn · v1</text>

  <rect x="520" y="520" width="342" height="48" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="540" y="540" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">extensions/</text>
  <text x="540" y="558" font-size="12" fill="#6b7280">notes + imports · side door</text>

  <rect x="870" y="520" width="350" height="48" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="890" y="540" font-size="15" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">phase2_workspace_diff.md</text>
  <text x="890" y="558" font-size="12" fill="#6b7280">ephemeral · not committed</text>

  <rect x="520" y="580" width="700" height="36" rx="10" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="540" y="604" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3a3f46">.git/  baseline after each successful Phase 2</text>

  <!-- publish: stage1 → recaps -->
  <line x1="364" y1="176" x2="518" y2="176" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>
  <text x="440" y="166" text-anchor="middle" font-size="12" fill="#6b7280">publish</text>

  <!-- cite: summary → usage, aligned -->
  <line x1="520" y1="476" x2="366" y2="476" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#farrow)"/>
  <text x="440" y="466" text-anchor="middle" font-size="12" fill="#6b7280">cite</text>

  <!-- ===== bottom flow ===== -->
  <line x1="40" y1="650" x2="1240" y2="650" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="40" y="674" width="188" height="112" rx="12" fill="#FCE8EA" stroke="#DD2E44" stroke-width="4"/>
  <text x="134" y="720" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">1  extract</text>
  <text x="134" y="744" text-anchor="middle" font-size="13" fill="#6b7280">transcript → db row</text>
  <line x1="228" y1="730" x2="272" y2="730" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="276" y="674" width="208" height="112" rx="12" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="380" y="720" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b7280">publish</text>
  <text x="380" y="744" text-anchor="middle" font-size="13" fill="#8a8f98">ranked subset → files</text>
  <line x1="484" y1="730" x2="528" y2="730" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="532" y="674" width="236" height="112" rx="12" fill="#E8F6E6" stroke="#53B44A" stroke-width="4"/>
  <text x="650" y="720" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">2  consolidate</text>
  <text x="650" y="744" text-anchor="middle" font-size="13" fill="#6b7280">MEMORY.md, then summary</text>
  <line x1="768" y1="730" x2="812" y2="730" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="816" y="674" width="424" height="112" rx="12" fill="#E3F0FA" stroke="#4A90D9" stroke-width="4"/>
  <text x="1028" y="720" text-anchor="middle" font-size="16" font-weight="bold" fill="#3a3f46">3  read</text>
  <text x="1028" y="744" text-anchor="middle" font-size="13" fill="#6b7280">inject · search · cite</text>
</svg>
