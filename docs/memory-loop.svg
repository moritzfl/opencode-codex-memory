<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="looparrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- boxes: 210x130 at cardinals of circle(cx=512, cy=532, r=300) -->
  <!-- top: read path -->
  <rect x="407" y="167" width="210" height="130" rx="26" fill="#E3F0FA" stroke="#4A90D9" stroke-width="5"/>
  <text x="512" y="198" text-anchor="middle" font-size="13" letter-spacing="1.2" fill="#4A90D9">READ PATH</text>
  <text x="512" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Answer uses</text>
  <text x="512" y="254" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">memory</text>

  <!-- right: usage bookkeeping, not a job -->
  <rect x="707" y="467" width="210" height="130" rx="26" fill="#ffffff" stroke="#c5c9ce" stroke-width="3"/>
  <text x="812" y="521" text-anchor="middle" font-size="24" font-weight="bold" fill="#3a3f46">Citation</text>
  <text x="812" y="551" text-anchor="middle" font-size="24" font-weight="bold" fill="#3a3f46">recorded</text>

  <!-- bottom: phase 2 -->
  <rect x="407" y="767" width="210" height="130" rx="26" fill="#E8F6E6" stroke="#53B44A" stroke-width="5"/>
  <text x="512" y="798" text-anchor="middle" font-size="13" letter-spacing="1.2" fill="#53B44A">PHASE 2</text>
  <text x="512" y="828" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Ranking and</text>
  <text x="512" y="854" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">pruning</text>

  <!-- left: injected summary artifact -->
  <rect x="82" y="467" width="260" height="130" rx="26" fill="#ffffff" stroke="#c5c9ce" stroke-width="3"/>
  <text x="212" y="521" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Sharper summary</text>
  <text x="212" y="551" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">next time</text>

  <!-- arcs: circle cx512 cy532 r=300; 42deg segments tangent to boxes -->
  <!-- top->right: from (655,288) to (782,434) -->
  <path d="M 655 288 A 300 300 0 0 1 782 434" fill="none" stroke="#8a8f98" stroke-width="5" marker-end="url(#looparrow)"/>
  <!-- right->bottom: from (790,632) to (659,782) -->
  <path d="M 790 632 A 300 300 0 0 1 659 782" fill="none" stroke="#8a8f98" stroke-width="5" marker-end="url(#looparrow)"/>
  <!-- bottom->left: from (365,782) to (234,632) -->
  <path d="M 365 782 A 300 300 0 0 1 234 632" fill="none" stroke="#8a8f98" stroke-width="5" marker-end="url(#looparrow)"/>
  <!-- left->top: from (232,432) to (369,288) -->
  <path d="M 232 432 A 300 300 0 0 1 369 288" fill="none" stroke="#8a8f98" stroke-width="5" marker-end="url(#looparrow)"/>

  <!-- center caption -->
  <text x="512" y="510" text-anchor="middle" font-size="24" fill="#8a8f98">the memory finds out</text>
  <text x="512" y="542" text-anchor="middle" font-size="24" fill="#8a8f98">which notes were</text>
  <text x="512" y="574" text-anchor="middle" font-size="24" fill="#8a8f98">worth writing</text>
</svg>