<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1280" height="700" fill="#ffffff"/>

  <!-- ===== WRITE PATH ===== -->
  <text x="40" y="36" font-size="18" letter-spacing="1.5" fill="#8a8f98">WRITE PATH</text>

  <circle cx="90" cy="130" r="18" fill="#8a8f98"/>
  <text x="90" y="184" text-anchor="middle" font-size="20" fill="#3a3f46">conversation</text>
  <text x="90" y="208" text-anchor="middle" font-size="20" fill="#3a3f46">ends</text>
  <line x1="116" y1="130" x2="184" y2="130" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="192" y="70" width="310" height="120" rx="14" fill="#ffffff" stroke="#DD2E44" stroke-width="3"/>
  <text x="347" y="116" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Phase 1: extraction</text>
  <text x="347" y="146" text-anchor="middle" font-size="18" fill="#6b7280">one cheap model,</text>
  <text x="347" y="168" text-anchor="middle" font-size="18" fill="#6b7280">one session</text>
  <line x1="510" y1="130" x2="578" y2="130" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="586" y="70" width="310" height="120" rx="14" fill="#ffffff" stroke="#4A90D9" stroke-width="3"/>
  <text x="741" y="116" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Per-session records</text>
  <text x="741" y="146" text-anchor="middle" font-size="18" fill="#6b7280">staged in the</text>
  <text x="741" y="168" text-anchor="middle" font-size="18" fill="#6b7280">local database</text>

  <line x1="741" y1="198" x2="741" y2="270" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>
  <text x="761" y="242" font-size="18" fill="#6b7280">hours later</text>

  <rect x="561" y="278" width="360" height="120" rx="14" fill="#ffffff" stroke="#53B44A" stroke-width="3"/>
  <text x="741" y="324" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Phase 2: consolidation</text>
  <text x="741" y="354" text-anchor="middle" font-size="18" fill="#6b7280">one strong model,</text>
  <text x="741" y="376" text-anchor="middle" font-size="18" fill="#6b7280">one run at a time</text>
  <line x1="929" y1="338" x2="998" y2="338" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="1006" y="278" width="234" height="120" rx="14" fill="#ffffff" stroke="#F4900C" stroke-width="3"/>
  <text x="1123" y="324" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Files</text>
  <text x="1123" y="354" text-anchor="middle" font-size="16" fill="#6b7280">summary</text>
  <text x="1123" y="376" text-anchor="middle" font-size="16" fill="#6b7280">handbook</text>

  <!-- divider -->
  <line x1="40" y1="440" x2="1240" y2="440" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== READ PATH ===== -->
  <text x="40" y="476" font-size="18" letter-spacing="1.5" fill="#8a8f98">READ PATH</text>

  <circle cx="90" cy="560" r="18" fill="#8a8f98"/>
  <text x="90" y="614" text-anchor="middle" font-size="20" fill="#3a3f46">every turn</text>
  <line x1="116" y1="560" x2="184" y2="560" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="192" y="500" width="310" height="120" rx="14" fill="#ffffff" stroke="#4A90D9" stroke-width="3"/>
  <text x="347" y="546" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Read path</text>
  <text x="347" y="576" text-anchor="middle" font-size="18" fill="#6b7280">inject the short</text>
  <text x="347" y="598" text-anchor="middle" font-size="18" fill="#6b7280">summary</text>
  <line x1="510" y1="560" x2="578" y2="560" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <rect x="586" y="500" width="310" height="120" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="3"/>
  <text x="741" y="546" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Search · cite</text>
  <text x="741" y="576" text-anchor="middle" font-size="18" fill="#6b7280">deeper layers</text>
  <text x="741" y="598" text-anchor="middle" font-size="18" fill="#6b7280">on demand</text>
</svg>
