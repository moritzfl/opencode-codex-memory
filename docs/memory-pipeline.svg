<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="farrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1280" height="700" fill="#ffffff"/>

  <!-- ===== WRITE PATH ===== -->
  <text x="40" y="36" font-size="18" letter-spacing="1.5" fill="#8a8f98">WRITE PATH</text>

  <circle cx="90" cy="130" r="18" fill="#c5c9ce"/>
  <text x="90" y="184" text-anchor="middle" font-size="20" fill="#6b7280">conversation</text>
  <text x="90" y="208" text-anchor="middle" font-size="20" fill="#6b7280">ends</text>
  <line x1="116" y1="130" x2="184" y2="130" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- 1. Phase 1 hero -->
  <rect x="192" y="62" width="310" height="136" rx="16" fill="#FCE8EA" stroke="#DD2E44" stroke-width="5"/>
  <circle cx="192" cy="62" r="18" fill="#DD2E44"/>
  <text x="192" y="68" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="347" y="116" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Phase 1: extraction</text>
  <text x="347" y="146" text-anchor="middle" font-size="18" fill="#6b7280">one cheap model,</text>
  <text x="347" y="168" text-anchor="middle" font-size="18" fill="#6b7280">one session</text>
  <line x1="510" y1="130" x2="578" y2="130" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- supporting: records -->
  <rect x="586" y="78" width="310" height="104" rx="12" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="741" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b7280">Per-session records</text>
  <text x="741" y="142" text-anchor="middle" font-size="16" fill="#8a8f98">staged in the</text>
  <text x="741" y="162" text-anchor="middle" font-size="16" fill="#8a8f98">local database</text>

  <line x1="741" y1="190" x2="741" y2="270" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>
  <text x="761" y="238" font-size="18" fill="#6b7280">hours later</text>

  <!-- 2. Phase 2 hero -->
  <rect x="541" y="278" width="400" height="136" rx="16" fill="#E8F6E6" stroke="#53B44A" stroke-width="5"/>
  <circle cx="541" cy="278" r="18" fill="#53B44A"/>
  <text x="541" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="741" y="332" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Phase 2: consolidation</text>
  <text x="741" y="362" text-anchor="middle" font-size="18" fill="#6b7280">one strong model,</text>
  <text x="741" y="384" text-anchor="middle" font-size="18" fill="#6b7280">one run at a time</text>
  <line x1="949" y1="346" x2="1018" y2="346" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- supporting: files -->
  <rect x="1026" y="294" width="214" height="104" rx="12" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="1133" y="332" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b7280">Files</text>
  <text x="1133" y="358" text-anchor="middle" font-size="16" fill="#8a8f98">summary</text>
  <text x="1133" y="378" text-anchor="middle" font-size="16" fill="#8a8f98">handbook</text>

  <!-- divider -->
  <line x1="40" y1="448" x2="1240" y2="448" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== READ PATH ===== -->
  <text x="40" y="484" font-size="18" letter-spacing="1.5" fill="#8a8f98">READ PATH</text>

  <circle cx="90" cy="568" r="18" fill="#c5c9ce"/>
  <text x="90" y="622" text-anchor="middle" font-size="20" fill="#6b7280">every turn</text>
  <line x1="116" y1="568" x2="184" y2="568" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- 3. Read path hero -->
  <rect x="192" y="500" width="310" height="136" rx="16" fill="#E3F0FA" stroke="#4A90D9" stroke-width="5"/>
  <circle cx="192" cy="500" r="18" fill="#4A90D9"/>
  <text x="192" y="506" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="347" y="554" text-anchor="middle" font-size="22" font-weight="bold" fill="#3a3f46">Read path</text>
  <text x="347" y="584" text-anchor="middle" font-size="18" fill="#6b7280">inject the short</text>
  <text x="347" y="606" text-anchor="middle" font-size="18" fill="#6b7280">summary</text>
  <line x1="510" y1="568" x2="578" y2="568" stroke="#6b7280" stroke-width="3" marker-end="url(#farrow)"/>

  <!-- supporting: search -->
  <rect x="586" y="516" width="310" height="104" rx="12" fill="#ffffff" stroke="#c5c9ce" stroke-width="2"/>
  <text x="741" y="554" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b7280">Search · cite</text>
  <text x="741" y="580" text-anchor="middle" font-size="16" fill="#8a8f98">deeper layers</text>
  <text x="741" y="600" text-anchor="middle" font-size="16" fill="#8a8f98">on demand</text>
</svg>
